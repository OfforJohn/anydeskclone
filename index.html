<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeoApp Remote | Dual Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-accent: #E94560;
            --hover-accent: #ff4d6d;
            --bg-dark: #0F0F0F;
            --card-bg: #1A1A1A;
            --text-main: #FFFFFF;
            --text-dim: #AAAAAA;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .logo { display: flex; align-items: center; gap: 12px; font-size: 1.2rem; font-weight: 600; color: white; }
        .logo i { font-size: 1.5rem; }

        #setup-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .setup-card {
            background: rgba(26, 26, 26, 0.9);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        input {
            width: 100%; padding: 16px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: white; font-size: 1.2rem; box-sizing: border-box; text-align: center; margin-bottom: 24px;
        }

        .btn-primary {
            width: 100%; padding: 16px; background: white; color: black; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer; text-transform: uppercase;
        }

        main {
            flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
            padding: 20px 40px; box-sizing: border-box; gap: 20px; flex-wrap: nowrap;
        }

        .remote-container {
            flex: 1; width: 100%; height: 100%; max-width: 600px; max-height: 78vh;
            display: flex; align-items: center; justify-content: center; background: #000;
            border: 10px solid #111; border-radius: 40px; overflow: hidden; position: relative;
            cursor: crosshair;
        }

        video { width: 100%; height: 100%; object-fit: contain; display: none; }
        canvas { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

        .status-badge {
            position: absolute; top: 20px; right: 24px; padding: 8px 16px; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px); border-radius: 20px; font-size: 0.8rem; display: flex;
            flex-direction: column; align-items: flex-end; gap: 4px; border: 1px solid rgba(255,255,255,0.1);
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4444; }
        .status-dot.active { background: #00ff88; box-shadow: 0 0 10px #00ff88; }

        .control-panel {
            position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column;
            align-items: flex-end; gap: 15px; z-index: 10000;
        }

        .panel-actions {
            display: flex; gap: 10px; background: rgba(0, 0, 0, 0.7); padding: 10px;
            border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s; max-width: 0; overflow: hidden; opacity: 0; white-space: nowrap;
        }

        .panel-actions.expanded { max-width: 1000px; opacity: 1; }

        .toggle-panel-btn {
            width: 48px; height: 48px; border-radius: 50%; background: var(--primary-accent);
            color: white; border: none; cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 1.2rem; transition: transform 0.3s;
        }

        .click-log-window, .mock-ui-window, .debug-panel {
            width: 250px; max-height: 200px; background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; display: none; flex-direction: column; overflow: hidden;
        }

        .log-header { padding: 8px 12px; background: rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-dim); }
        .log-content { flex: 1; overflow-y: auto; padding: 8px; font-family: monospace; font-size: 0.7rem; }
        .log-entry { padding: 4px; border-radius: 4px; margin-bottom: 2px; border-left: 2px solid #00ff88; display: flex; justify-content: space-between; }

        .action-btn {
            padding: 8px 15px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; color: white; cursor: pointer; font-size: 0.8rem;
        }
        .active-mode { background: #00ff88 !important; color: black !important; }

        .simulator-overlay {
            position: fixed; display: none; flex-direction: column; background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px); z-index: 2000; border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px; overflow: hidden;
        }

        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 100%; height: 100%; }
        .pin-btn { border-radius: 50%; border: 1px solid #444; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }

        .pattern-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 80%; }
        .pattern-dot { width: 12px; height: 12px; background: #fff; border-radius: 50%; border: 2px solid #00ff88; justify-self: center; }

        /* Animation */
        .remote-tap-indicator {
            position: absolute; width: 30px; height: 30px; border: 2px solid #00ff88;
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
            animation: ripple 0.6s ease-out forwards; z-index: 100;
        }
        @keyframes ripple { from { transform: translate(-50%, -50%) scale(0.1); opacity: 1; } to { transform: translate(-50%, -50%) scale(2); opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fas fa-satellite-dish"></i><span>MEO REMOTE</span></div>
        <div id="active-info" style="margin-left: auto; display: none;">
            <span id="display-room-id" style="font-weight: 700; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 8px;">-</span>
            <button onclick="refreshConnection()" style="background:none; border:1px solid #444; color:white; padding:4px 8px; border-radius:5px; margin-left:10px; cursor:pointer;">Refresh</button>
        </div>
    </header>

    <div id="setup-screen">
        <div class="setup-card">
            <h2>Enter Session ID</h2>
            <input type="text" id="roomId" placeholder="ID">
            <button class="btn-primary" onclick="startSharing()">Connect</button>
        </div>
    </div>

    <main>
        <div class="remote-container" id="remote-container">
            <div id="dino-loader">Waiting for device...</div>
            <video id="remoteVideo" autoplay playsinline></video>
            <canvas id="draw-overlay"></canvas>
        </div>
        <div class="remote-container" id="remote-container-2">
            <div id="dino-loader-2">Waiting for device...</div>
            <video id="remoteVideo2" autoplay playsinline muted></video>
            <canvas id="draw-overlay-2"></canvas>
        </div>
    </main>

    <!-- Simulators (Moved outside containers to prevent clipping) -->
    <div id="pin-simulator" class="simulator-overlay" style="width: 180px; height: 250px; bottom: 100px; left: 50px;">
        <div class="modal-header"><span>PIN GUIDE</span></div>
        <div style="flex:1; padding:15px;"><div class="pin-grid">
            <div class="pin-btn">1</div><div class="pin-btn">2</div><div class="pin-btn">3</div>
            <div class="pin-btn">4</div><div class="pin-btn">5</div><div class="pin-btn">6</div>
            <div class="pin-btn">7</div><div class="pin-btn">8</div><div class="pin-btn">9</div>
            <div></div><div class="pin-btn">0</div>
        </div></div>
    </div>

    <div id="pattern-simulator" class="simulator-overlay" style="width: 200px; height: 200px; bottom: 100px; left: 250px;">
        <div class="modal-header"><span>PATTERN GUIDE</span></div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center;">
            <div class="pattern-grid">
                <div class="pattern-dot"></div><div class="pattern-dot"></div><div class="pattern-dot"></div>
                <div class="pattern-dot"></div><div class="pattern-dot"></div><div class="pattern-dot"></div>
                <div class="pattern-dot"></div><div class="pattern-dot"></div><div class="pattern-dot"></div>
            </div>
        </div>
    </div>

    <div class="status-badge">
        <div class="status-info"><div id="status-dot" class="status-dot"></div><span id="status-text">Ready</span></div>
        <div id="coord-info" class="coord-display">X: 0, Y: 0</div>
    </div>

    <div class="control-panel" id="remote-controls" style="display: none;">
        <div class="click-log-window" id="click-log-window" style="display: flex;">
            <div class="log-header"><span>TRACKER</span><span onclick="clearClickLog()" style="cursor:pointer;">Clear</span></div>
            <div class="log-content" id="click-log-content"></div>
        </div>

        <div class="control-panel-wrapper">
            <div class="panel-actions" id="main-actions-panel">
                <button class="action-btn" onclick="wakeDevice()"><i class="fas fa-sun"></i> Wake</button>
                <button class="action-btn" id="security-mode" onclick="toggleSecurityOverride()"><i class="fas fa-shield-alt"></i> Override</button>
                <input type="password" id="unlock-pin" style="width:60px; display:none;" placeholder="PIN">
                <button class="action-btn" id="unlock-toggle" onclick="toggleUnlockInput()"><i class="fas fa-keyboard"></i> PIN</button>
                <button class="action-btn" id="pattern-toggle" onclick="togglePatternMode()"><i class="fas fa-braille"></i> Pattern</button>
                <div style="display: flex; gap: 5px; background: rgba(255,255,255,0.1); padding: 5px; border-radius: 8px;">
                    <input type="text" id="remote-type-input" placeholder="Chat..." style="width: 80px; margin:0; border:none; background:transparent; color:white; font-size:0.8rem; outline:none;">
                    <button class="action-btn" onclick="sendTypeText()" style="padding:5px; background:#00ff88; color:black;"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
            <button class="toggle-panel-btn" onclick="toggleMainPanel()"><i class="fas fa-chevron-left"></i></button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
