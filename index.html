<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeoApp Remote | Control Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-accent: #E94560;
            --hover-accent: #ff4d6d;
            --bg-dark: #0F0F0F;
            --card-bg: #1A1A1A;
            --text-main: #FFFFFF;
            --text-dim: #AAAAAA;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
        }

        .logo i { font-size: 1.5rem; }

        #setup-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .setup-card {
            background: rgba(26, 26, 26, 0.9);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            text-align: center;
        }

        .setup-card h2 { margin-top: 0; margin-bottom: 12px; font-weight: 700; }
        .setup-card p { color: var(--text-dim); margin-bottom: 32px; font-size: 0.95rem; }

        input {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
            text-align: center;
            margin-bottom: 24px;
        }

        input:focus { border-color: white; background: rgba(255, 255, 255, 0.1); }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: white;
            color: black;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            text-transform: uppercase;
        }

        .btn-primary:hover { transform: scale(1.02); }

        main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 40px;
            box-sizing: border-box;
        }

        .remote-container {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 78vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text y="24" style="font-size: 24px;">👆</text></svg>') 8 0, auto;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            background: #000;
            border: 12px solid #111;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        #draw-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .status-badge {
            position: absolute;
            top: 20px;
            right: 24px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column; /* Changed to column to stack status and coords */
            align-items: flex-end;
            gap: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coord-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.7rem;
            color: #00ff88;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            display: none; /* Hidden by default */
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4444; }
        .status-dot.active { background: #00ff88; box-shadow: 0 0 10px #00ff88; }

        .control-panel {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column; /* Changed to column to stack panel and log */
            align-items: flex-end;
            gap: 15px;
            z-index: 10000;
        }

        .panel-actions {
            display: flex;
            flex-direction: row; /* Horizontal layout for buttons */
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 0;
            overflow: hidden;
            opacity: 0;
            white-space: nowrap;
            padding-left: 0;
            padding-right: 0;
            border: none;
        }

        .panel-actions.expanded {
            max-width: 800px; /* Large enough to hold all buttons */
            opacity: 1;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-panel-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-panel-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary-accent);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            z-index: 10001;
            transition: transform 0.3s;
        }

        .toggle-panel-btn.active {
            transform: rotate(180deg);
            background: #444;
        }

        .action-btn.restricted {
            border-color: #ffaa00;
            color: #ffaa00;
        }

        .action-btn.restricted:hover {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
        }

        .click-log-window {
            width: 250px;
            max-height: 200px;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: none; /* Shown only when connected */
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .log-header {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-dim);
        }

        .log-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
        }

        .log-entry {
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 2px solid #00ff88;
            display: flex;
            justify-content: space-between;
        }

        .log-entry:nth-child(even) {
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-clear-log {
            cursor: pointer;
            color: var(--primary-accent);
            font-size: 0.7rem;
        }
        .btn-clear-log:hover { text-decoration: underline; }

        .action-btn {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .action-btn:hover { background: rgba(255, 255, 255, 0.8); color: black; }
        .active-mode { background: #00ff88 !important; color: black !important; font-weight: bold; }

        .unlock-input {
            width: 80px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .btn-refresh {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.2s;
            font-size: 0.8rem;
        }
        .btn-refresh:hover { background: rgba(255, 255, 255, 0.2); }

        #dino-loader {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 5;
        }
        .dino-track {
            position: relative;
            width: 300px;
            height: 100px;
            overflow: hidden;
            border-bottom: 2px solid #333;
            margin-bottom: 20px;
        }
        .scrolling-dino {
            position: absolute;
            font-size: 40px;
            bottom: 5px;
            animation: dino-scroll linear infinite;
        }
        .dino-1 { animation-duration: 3s; left: -50px; }
        .dino-2 { animation-duration: 5s; left: -100px; animation-delay: 1s; }
        .dino-3 { animation-duration: 4s; left: -150px; animation-delay: 0.5s; }
        @keyframes dino-scroll {
            from { transform: translateX(0); left: -50px; }
            to { transform: translateX(400px); left: -50px; }
        }

        /* Simulator Overlays - Higher Visibility & Movable/Resizable */
        .simulator-overlay {
            position: absolute;
            display: none;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            z-index: 2000;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            min-width: 180px;
            min-height: 200px;
            user-select: none;
            touch-action: none;
            pointer-events: none;
        }

        .modal-header {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: bold;
            pointer-events: auto;
        }

        .resize-handle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: transparent;
            bottom: 0;
            right: 0;
            cursor: nwse-resize;
            z-index: 2001;
            pointer-events: auto;
        }

        .resize-handle::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border-right: 2px solid rgba(255, 255, 255, 0.5);
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            bottom: 5px;
            right: 5px;
        }

        .simulator-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            pointer-events: none;
        }

        .pin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
        }

        .pin-btn {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15%;
            width: 80%;
            height: 80%;
            position: relative;
            pointer-events: none;
        }

        .pattern-dot {
            width: 12px;
            height: 12px;
            background: #ffffff;
            border: 2px solid #00ff88;
            border-radius: 50%;
            justify-self: center;
            align-self: center;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        /* Click Indicator Animation */
        .click-indicator {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #00ff88;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: ripple 0.5s ease-out forwards;
            z-index: 9999;
        }

        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fas fa-satellite-dish"></i>
            <span>Control Center</span>
        </div>
        <div id="active-info" style="margin-left: auto; display: none;">
            <span id="display-room-id" style="font-weight: 700; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 8px;">-</span>
            <button class="btn-refresh" onclick="refreshConnection()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
    </header>

    <div id="setup-screen">
        <div class="setup-card">
            <i class="fas fa-fingerprint" style="font-size: 3.5rem; color: white; margin-bottom: 24px;"></i>
            <h2>Remote Access</h2>
            <p>Enter the ID from your device to start the session.</p>
            <input type="text" id="roomId" placeholder="ID" autocomplete="off">
            <button class="btn-primary" onclick="startSharing()">Connect Now</button>
        </div>
    </div>

    <main>
        <div class="remote-container" id="remote-container">
            <div id="dino-loader" style="display: none;">
                <div class="dino-track">
                    <div class="scrolling-dino dino-1">🦖</div>
                    <div class="scrolling-dino dino-2">🦕</div>
                    <div class="scrolling-dino dino-3">🦖</div>
                </div>
                <div class="waiting-text" style="color: #888;">Waiting for device screen...</div>
            </div>
            <video id="remoteVideo" autoplay playsinline></video>
            <canvas id="draw-overlay"></canvas>

            <!-- Movable PIN Simulator -->
            <div id="pin-simulator" class="simulator-overlay" style="width: 220px; height: 320px; top: 10%; left: 10%;">
                <div class="modal-header">
                    <span><i class="fas fa-th"></i> PIN GUIDE</span>
                    <i class="fas fa-compress-arrows-alt"></i>
                </div>
                <div class="simulator-content">
                    <div class="pin-grid">
                        <div class="pin-btn">1</div><div class="pin-btn">2</div><div class="pin-btn">3</div>
                        <div class="pin-btn">4</div><div class="pin-btn">5</div><div class="pin-btn">6</div>
                        <div class="pin-btn">7</div><div class="pin-btn">8</div><div class="pin-btn">9</div>
                        <div class="pin-btn" style="opacity: 0.3;"><i class="fas fa-backspace"></i></div>
                        <div class="pin-btn">0</div>
                        <div class="pin-btn" style="opacity: 0.3;">OK</div>
                    </div>
                </div>
                <div class="resize-handle"></div>
            </div>

            <!-- Movable Pattern Simulator -->
            <div id="pattern-simulator" class="simulator-overlay" style="width: 250px; height: 250px; top: 10%; right: 10%;">
                <div class="modal-header">
                    <span><i class="fas fa-braille"></i> PATTERN GUIDE</span>
                    <i class="fas fa-compress-arrows-alt"></i>
                </div>
                <div class="simulator-content">
                    <div class="pattern-grid">
                        <div class="pattern-dot"></div><div class="pattern-dot"></div><div class="pattern-dot"></div>
                        <div class="pattern-dot"></div><div class="pattern-dot"></div><div class="pattern-dot"></div>
                        <div class="pattern-dot"></div><div class="pattern-dot"></div><div class="pattern-dot"></div>
                    </div>
                </div>
                <div class="resize-handle"></div>
            </div>
        </div>

        <div class="status-badge" style="z-index: 10000;">
            <div class="status-info">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">Ready</span>
            </div>
            <div id="coord-info" class="coord-display">X: 0, Y: 0</div>
        </div>

        <div class="control-panel" id="remote-controls" style="display: none;">
            <!-- Click Log Window -->
            <div class="click-log-window" id="click-log-window" style="display: flex;">
                <div class="log-header">
                    <span><i class="fas fa-list-ul"></i> CLICK TRACKER</span>
                    <span class="btn-clear-log" onclick="clearClickLog()">Clear</span>
                </div>
                <div class="log-content" id="click-log-content">
                    <div style="color: #666; font-style: italic; text-align: center; padding: 10px;">Waiting for taps...</div>
                </div>
            </div>

            <!-- Main Actions (Now Collapsible) -->
            <div class="control-panel-wrapper">
                <div class="panel-actions" id="main-actions-panel">
                    <button class="action-btn" id="wake-btn" onclick="wakeDevice()">
                        <i class="fas fa-sun"></i> Wake
                    </button>
                    <button class="action-btn restricted" id="security-mode" onclick="toggleSecurityOverride()" title="Enable when screen is black">
                        <i class="fas fa-shield-alt"></i> Security Override
                    </button>
                    <input type="password" id="unlock-pin" class="unlock-input" placeholder="PIN" maxlength="6">
                    <button class="action-btn" id="unlock-toggle" onclick="toggleUnlockInput()">
                        <i class="fas fa-keyboard"></i> PIN
                    </button>
                    <button class="action-btn" id="pattern-toggle" onclick="togglePatternMode()">
                        <i class="fas fa-braille"></i> Pattern Mode
                    </button>
                    <button class="action-btn" id="send-unlock" style="display: none;" onclick="sendUnlock()">
                        Confirm
                    </button>
                </div>
                <button class="toggle-panel-btn" id="panel-toggle" onclick="toggleMainPanel()">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // RENDER FIX: Use a dynamic connection for Socket.io
        const socket = io(window.location.origin, {
            transports: ['websocket', 'polling'],
            upgrade: true
        });

        // Debug connection
        socket.on('connect', () => {
            console.log("Connected to server with ID:", socket.id);
        });

        let peerConnection;
        let dataChannel;

        const remoteVideo = document.getElementById('remoteVideo');
        const drawCanvas = document.getElementById('draw-overlay');
        const drawCtx = drawCanvas.getContext('2d');
        const dinoLoader = document.getElementById('dino-loader');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const roomIdInput = document.getElementById('roomId');

        const pinSimulator = document.getElementById('pin-simulator');
        const patternSimulator = document.getElementById('pattern-simulator');
        const unlockInput = document.getElementById('unlock-pin');
        const confirmBtn = document.getElementById('send-unlock');

        let isPatternMode = false;
        let isPinMode = false;
        let patternPoints = [];

        // Make elements draggable and resizable
        function makeMovable(element) {
            const header = element.querySelector('.modal-header');
            const resizer = element.querySelector('.resize-handle');

            let isDragging = false;
            let isResizing = false;
            let startX, startY, startWidth, startHeight, startLeft, startTop;

            header.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = parseInt(window.getComputedStyle(element).left);
                startTop = parseInt(window.getComputedStyle(element).top);
                element.style.zIndex = 3000;
                document.querySelectorAll('.simulator-overlay').forEach(el => {
                   if(el !== element) el.style.zIndex = 2000;
                });
            });

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startY = e.clientY;
                startWidth = parseInt(window.getComputedStyle(element).width);
                startHeight = parseInt(window.getComputedStyle(element).height);
                e.stopPropagation();
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    element.style.left = (startLeft + dx) + 'px';
                    element.style.top = (startTop + dy) + 'px';
                    element.style.right = 'auto';
                }
                if (isResizing) {
                    const dw = e.clientX - startX;
                    const dh = e.clientY - startY;
                    element.style.width = Math.max(150, startWidth + dw) + 'px';
                    element.style.height = Math.max(150, startHeight + dh) + 'px';
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                isResizing = false;
            });
        }

        makeMovable(pinSimulator);
        makeMovable(patternSimulator);

        // Saved Room ID
        const savedRoomId = localStorage.getItem('lastRoomId');
        if (savedRoomId) roomIdInput.value = savedRoomId;

        function updateStatus(status, isActive) {
            statusText.innerText = status;
            statusDot.className = 'status-dot' + (isActive ? ' active' : '');
            if (isActive) {
                document.getElementById('remote-controls').style.display = 'flex';
                document.getElementById('active-info').style.display = 'block';
            }
        }

        function toggleUnlockInput() {
            isPinMode = !isPinMode;
            const btn = document.getElementById('unlock-toggle');
            if (isPinMode) {
                pinSimulator.style.display = 'flex';
                unlockInput.style.display = 'block';
                confirmBtn.style.display = 'block';
                btn.classList.add('active-mode');
                btn.innerHTML = '<i class="fas fa-times"></i> Close PIN';
                wakeDevice(); // Also try to wake when opening PIN
            } else {
                pinSimulator.style.display = 'none';
                unlockInput.style.display = 'none';
                confirmBtn.style.display = 'none';
                btn.classList.remove('active-mode');
                btn.innerHTML = '<i class="fas fa-keyboard"></i> PIN';
            }
        }

        function sendUnlock() {
            const pin = unlockInput.value;
            if (pin && dataChannel?.readyState === 'open') {
                dataChannel.send(JSON.stringify({ type: 'unlock', pin: pin }));
                toggleUnlockInput();
                unlockInput.value = "";
            }
        }

        function togglePatternMode() {
            isPatternMode = !isPatternMode;
            const btn = document.getElementById('pattern-toggle');
            if (isPatternMode) {
                patternSimulator.style.display = 'flex';
                btn.classList.add('active-mode');
                btn.innerHTML = '<i class="fas fa-fingerprint"></i> DRAW ON SCREEN';

                drawCanvas.width = remoteVideo.clientWidth;
                drawCanvas.height = remoteVideo.clientHeight;
                drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);

                wakeDevice(); // Also try to wake when opening Pattern
            } else {
                patternSimulator.style.display = 'none';
                btn.classList.remove('active-mode');
                btn.innerHTML = '<i class="fas fa-braille"></i> Pattern Mode';
                drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            }
        }

        let isSecurityOverride = false;

        function toggleSecurityOverride() {
            isSecurityOverride = !isSecurityOverride;
            const btn = document.getElementById('security-mode');
            if (isSecurityOverride) {
                btn.classList.add('active-mode');
                btn.innerHTML = '<i class="fas fa-eye"></i> OVERRIDE ON';
                // When override is on, we ensure the video container stays interactive even if stream is blank
                remoteVideo.style.display = 'block';
                remoteVideo.style.background = '#111'; // Dark grey instead of total black
                dinoLoader.style.display = 'none';
            } else {
                btn.classList.remove('active-mode');
                btn.innerHTML = '<i class="fas fa-shield-alt"></i> Security Override';
                if (!remoteVideo.srcObject) {
                    remoteVideo.style.display = 'none';
                    dinoLoader.style.display = 'flex';
                }
            }
        }

        function wakeDevice() {
            if (dataChannel?.readyState === 'open') {
                dataChannel.send(JSON.stringify({ type: 'wake' }));
            }
        }

        function getCoords(e) {
            const rect = remoteVideo.getBoundingClientRect();
            const videoRatio = remoteVideo.videoWidth / remoteVideo.videoHeight || 1;
            const elementRatio = rect.width / rect.height;
            let actualWidth, actualHeight, offsetX, offsetY;
            if (elementRatio > videoRatio) {
                actualHeight = rect.height; actualWidth = actualHeight * videoRatio;
                offsetX = (rect.width - actualWidth) / 2; offsetY = 0;
            } else {
                actualWidth = rect.width; actualHeight = actualWidth / videoRatio;
                offsetX = 0; offsetY = (rect.height - actualHeight) / 2;
            }
            return {
                x: (e.clientX - rect.left - offsetX) / actualWidth,
                y: (e.clientY - rect.top - offsetY) / actualHeight,
                canvasX: e.clientX - rect.left,
                canvasY: e.clientY - rect.top
            };
        }

        function showClickEffect(e) {
            const effect = document.createElement('div');
            effect.className = 'click-indicator';
            effect.style.left = e.clientX + 'px';
            effect.style.top = e.clientY + 'px';
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 500);
        }

        let isMouseDown = false;
        let startX, startY, startTime;

        remoteVideo.addEventListener('mousedown', (e) => {
            if (remoteVideo.style.display === 'none') return;
            showClickEffect(e);
            isMouseDown = true;
            const coords = getCoords(e);
            startX = coords.x; startY = coords.y; startTime = Date.now();

            if (isPatternMode) {
                patternPoints = [{ x: coords.x, y: coords.y }];
                drawCtx.beginPath();
                drawCtx.lineWidth = 4;
                drawCtx.strokeStyle = "#00ff88";
                drawCtx.moveTo(coords.canvasX, coords.canvasY);
            }
            e.preventDefault();
        });

        remoteVideo.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const coords = getCoords(e);
            if (isPatternMode) {
                patternPoints.push({ x: coords.x, y: coords.y });
                drawCtx.lineTo(coords.canvasX, coords.canvasY);
                drawCtx.stroke();
            }
        });

        remoteVideo.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            isMouseDown = false;
            const coords = getCoords(e);
            const duration = Date.now() - startTime;
            const dist = Math.sqrt(Math.pow(coords.x - startX, 2) + Math.pow(coords.y - startY, 2));

            if (dataChannel?.readyState === 'open') {
                if (isPatternMode && patternPoints.length > 5) {
                    const clickId = Date.now();
                    dataChannel.send(JSON.stringify({ type: 'unlock', points: patternPoints }));

                    // Log the pattern attempt locally
                    displayCoordinates(startX, startY, "Pattern Attempt");

                    // Send to AI for pattern analysis
                    if (socket && socket.connected) {
                        const roomId = roomIdInput.value || localStorage.getItem('lastRoomId');
                        socket.emit("unlock_event", {
                            roomId: roomId,
                            points: patternPoints,
                            clickId: clickId
                        });
                    }

                    setTimeout(togglePatternMode, 1000);
                } else if (dist < 0.01) {
                    dataChannel.send(JSON.stringify({ type: 'click', x: startX, y: startY }));
                } else {
                    dataChannel.send(JSON.stringify({
                        type: 'swipe', x1: startX, y1: startY,
                        x2: coords.x, y2: coords.y, duration: Math.max(duration, 100)
                    }));
                }
            }
        });

        remoteVideo.addEventListener('mouseleave', () => { isMouseDown = false; });

        function startSharing() {
            const roomId = roomIdInput.value;
            if (!roomId) return;
            localStorage.setItem('lastRoomId', roomId);
            document.getElementById('setup-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('active-info').style.display = 'block';
                document.getElementById('display-room-id').innerText = roomId;
                dinoLoader.style.display = 'flex';
            }, 300);
            socket.emit("join", roomId);
            updateStatus("Connecting...", false);
            createPeerConnection(roomId);
        }

        function refreshConnection() {
            const roomId = roomIdInput.value || localStorage.getItem('lastRoomId');
            if (!roomId) return;
            updateStatus("Refreshing...", false);
            if (peerConnection) peerConnection.close();
            peerConnection = null;
            dataChannel = null;
            remoteVideo.style.display = 'none';
            dinoLoader.style.display = 'flex';
            socket.emit("join", roomId);
            createPeerConnection(roomId);
        }

        async function createPeerConnection(roomId) {
            if (peerConnection) return;
            const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
            peerConnection = new RTCPeerConnection(config);
            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                dataChannel.onopen = () => updateStatus("Live Control", true);

                // Handle messages from device
                dataChannel.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'click_feedback') {
                            displayCoordinates(data.x, data.y, "Laptop Tap");
                        } else if (data.type === 'device_click') {
                            displayCoordinates(data.x, data.y, data.label || "Device Tap");
                        }
                    } catch (e) {
                        console.error("Error parsing data channel message", e);
                    }
                };
            };
            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0] || new MediaStream([event.track]);
                remoteVideo.style.display = 'block';
                dinoLoader.style.display = 'none';
            };
            const offer = await peerConnection.createOffer({ offerToReceiveVideo: true });
            await peerConnection.setLocalDescription(offer);
            socket.emit("message", { roomId, offer });
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) socket.emit("message", { roomId, candidate: event.candidate });
            };
        }

        function toggleMainPanel() {
            const panel = document.getElementById('main-actions-panel');
            const btn = document.getElementById('panel-toggle');
            const icon = btn.querySelector('i');

            panel.classList.toggle('expanded');
            btn.classList.toggle('active');

            if (panel.classList.contains('expanded')) {
                icon.className = 'fas fa-chevron-right';
            } else {
                icon.className = 'fas fa-chevron-left';
            }
        }

        let clickCount = 0;

        function displayCoordinates(x, y, source = "Tap") {
            clickCount++;

            // Send click to server for Python AI tracking
            const clickId = Date.now();
            if (socket && socket.connected) {
                const roomId = roomIdInput.value || localStorage.getItem('lastRoomId');
                socket.emit("device_click", {
                    roomId: roomId,
                    x: x,
                    y: y,
                    label: source.includes("Device") ? "Physical Touch" : "Laptop Click",
                    source: source,
                    clickId: clickId
                });
            }

            const logContent = document.getElementById('click-log-content');

            // Remove placeholder if it's the first click
            if (clickCount === 1) logContent.innerHTML = '';

            const xPct = (x * 100).toFixed(1);
            const yPct = (y * 100).toFixed(1);

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.setAttribute('data-click-id', clickId);
            if (source.includes("Device")) {
                entry.style.borderLeft = "2px solid #ff4d6d"; // Red for device clicks
            }

            entry.innerHTML = `
                <span><b>${getOrdinal(clickCount)}</b> ${source}:</span>
                <span>${xPct}%, ${yPct}%</span>
            `;

            logContent.insertBefore(entry, logContent.firstChild);

            // Also update the small badge at the top
            const coordInfo = document.getElementById('coord-info');
            coordInfo.innerText = `${source}: ${xPct}%, ${yPct}%`;
            coordInfo.style.display = 'block';
        }

        function getOrdinal(n) {
            const s = ["th", "st", "nd", "rd"],
                  v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        function clearClickLog() {
            clickCount = 0;
            document.getElementById('click-log-content').innerHTML =
                '<div style="color: #666; font-style: italic; text-align: center; padding: 10px;">Waiting for taps...</div>';
            document.getElementById('coord-info').style.display = 'none';
        }

        socket.on("message", async (data) => {
            if (data.offer) {
                if (!peerConnection) await createPeerConnection(data.roomId);
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit("message", { roomId: data.roomId, answer });
            } else if (data.answer) {
                if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            } else if (data.candidate && peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        // Listen for AI feedback from Python
        socket.on("ai_key_guess_broadcast", (data) => {
            console.log("AI Guess Received:", data);

            // Visual indicator that AI is working
            const statusText = document.getElementById('status-text');
            const originalText = statusText.innerText;
            statusText.innerText = `AI: ${data.guessed_key}`;
            statusText.style.color = "#ffaa00";
            setTimeout(() => {
                statusText.innerText = originalText;
                statusText.style.color = "";
            }, 1000);

            const logContent = document.getElementById('click-log-content');

            // 1. Try to match by clickId (Most Reliable)
            if (data.clickId) {
                const matchedEntry = logContent.querySelector(`.log-entry[data-click-id="${data.clickId}"]`);
                if (matchedEntry) {
                    const labelSpan = matchedEntry.querySelector('span:first-child');
                    if (labelSpan && !labelSpan.innerHTML.includes('(AI:')) {
                        labelSpan.innerHTML += ` <span style="color:#ffaa00; font-size:0.65rem; font-weight:bold;">(AI: ${data.guessed_key})</span>`;
                        return;
                    }
                }
            }

            // 2. Fallback: Search all entries for coordinate match (Fuzzy Match)
            const entries = logContent.querySelectorAll('.log-entry');
            for (let entry of entries) {
                const entryText = entry.innerText || entry.textContent;
                // Parse percentages from entry text (e.g., "50.3%, 79.9%")
                const matches = entryText.match(/(\d+\.\d+)%,\s+(\d+\.\d+)%/);
                if (matches) {
                    const entryX = parseFloat(matches[1]);
                    const entryY = parseFloat(matches[2]);
                    const aiX = data.x * 100;
                    const aiY = data.y * 100;

                    // Allow 1.5% tolerance for rounding differences on Render
                    if (Math.abs(entryX - aiX) < 1.5 && Math.abs(entryY - aiY) < 1.5) {
                        const labelSpan = entry.querySelector('span:first-child');
                        if (labelSpan && !labelSpan.innerHTML.includes('(AI:')) {
                            labelSpan.innerHTML += ` <span style="color:#ffaa00; font-size:0.65rem; font-weight:bold;">(AI: ${data.guessed_key})</span>`;
                            break;
                        }
                    }
                }
            }
        });
    </script>
</body>
